<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/header :: header}"></th:block>
    <title>회원가입</title>
</head>
<body>
    <th:block th:replace="~{fragments/nav :: nav}"></th:block>
    <main class="page-shell auth-shell">
        <div class="container auth-container">
            <section class="content-card auth-card">
                <div class="section-heading auth-heading">
                    <div>
                        <p class="eyebrow">Member Signup</p>
                        <h1>회원가입</h1>
                    </div>
                    <p class="section-description">일반 회원으로 가입하면 연락처 확인과 댓글 작성이 가능합니다.</p>
                </div>
                <form th:action="@{/signup}" th:object="${form}" method="post" class="form">
                    <input type="hidden" name="redirect" th:value="${redirect}" />
                    <div class="field-group">
                        <label>아이디</label>
                        <input type="text" th:field="*{username}" placeholder="4자 이상 20자 이하" required />
                        <div th:errors="*{username}" class="error"></div>
                    </div>
                    <div class="field-group">
                        <label>닉네임</label>
                        <input type="text" th:field="*{displayName}" placeholder="화면에 표시될 이름" required />
                        <div th:errors="*{displayName}" class="error"></div>
                    </div>
                    <div class="field-group">
                        <label>비밀번호</label>
                        <input type="password" th:field="*{password}" placeholder="6자 이상" required />
                        <div th:errors="*{password}" class="error"></div>
                    </div>
                    <div class="field-group">
                        <label>비밀번호 확인</label>
                        <input type="password" th:field="*{passwordConfirm}" placeholder="비밀번호를 다시 입력해 주세요" required />
                        <div th:errors="*{passwordConfirm}" class="error"></div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">회원가입</button>
                        <a th:href="@{/login(redirect=${redirect})}" class="btn btn-secondary">로그인으로</a>
                    </div>
                </form>
            </section>
        </div>
    </main>
    <th:block th:replace="~{fragments/footer :: footer}"></th:block>
</body>
</html>
