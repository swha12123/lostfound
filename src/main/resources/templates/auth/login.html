<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/header :: header}"></th:block>
    <title>로그인</title>
</head>
<body>
    <th:block th:replace="~{fragments/nav :: nav}"></th:block>
    <main class="page-shell auth-shell">
        <div class="container auth-container">
            <section class="content-card auth-card">
                <div class="section-heading auth-heading">
                    <div>
                        <p class="eyebrow">Administrator</p>
                        <h1>관리자 로그인</h1>
                    </div>
                    <p class="section-description">승인 대기 글을 확인하려면 관리자 계정으로 로그인해 주세요.</p>
                </div>
                <form th:action="@{/login}" method="post" class="form">
                    <div class="field-group">
                        <label>아이디</label>
                        <input type="text" name="username" placeholder="관리자 아이디" required />
                    </div>
                    <div class="field-group">
                        <label>비밀번호</label>
                        <input type="password" name="password" placeholder="비밀번호" required />
                    </div>
                    <div th:if="${param.error}" class="error card-error">아이디 또는 비밀번호가 올바르지 않습니다.</div>
                    <button type="submit" class="btn btn-primary full-width">로그인</button>
                </form>
            </section>
        </div>
    </main>
    <th:block th:replace="~{fragments/footer :: footer}"></th:block>
</body>
</html>
